services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    environment:
      PORT: 5000
      LEITESOL_API_ENVIRONMENT: production
      LEITESOL_API_ALLOWED_HOSTS: api,localhost,127.0.0.1
      LEITESOL_API_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "5000:5000"

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
      target: prod
    environment:
      PORT: 3001
      BACKEND_URL: http://api:5000
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - api
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    environment:
      PORT: 3000
      API_PROXY_PASS: http://gateway:3001/api/
      HEALTH_PROXY_PASS: http://gateway:3001/health/
    depends_on:
      - gateway
    ports:
      - "3000:3000"
