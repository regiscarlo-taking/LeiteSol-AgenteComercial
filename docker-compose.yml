services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    env_file:
      - .env
    environment:
      PORT: 5000
      LEITESOL_API_ENVIRONMENT: ${LEITESOL_API_ENVIRONMENT:-production}
      LEITESOL_API_ALLOWED_HOSTS: ${LEITESOL_API_ALLOWED_HOSTS:?LEITESOL_API_ALLOWED_HOSTS is required}
      LEITESOL_API_ALLOWED_ORIGINS: ${LEITESOL_API_ALLOWED_ORIGINS:?LEITESOL_API_ALLOWED_ORIGINS is required}
      LEITESOL_API_BASIC_AUTH_USERNAME: ${LEITESOL_API_BASIC_AUTH_USERNAME:?LEITESOL_API_BASIC_AUTH_USERNAME is required}
      LEITESOL_API_JWT_SECRET_KEY: ${LEITESOL_API_JWT_SECRET_KEY:?LEITESOL_API_JWT_SECRET_KEY is required}
      LEITESOL_API_JWT_ALGORITHM: ${LEITESOL_API_JWT_ALGORITHM:-HS256}
      LEITESOL_API_JWT_EXPIRATION_HOURS: ${LEITESOL_API_JWT_EXPIRATION_HOURS:-1}
      LEITESOL_API_JWT_REFRESH_EXPIRATION_HOURS: ${LEITESOL_API_JWT_REFRESH_EXPIRATION_HOURS:-168}
      LEITESOL_API_FABRIC_SERVER: ${LEITESOL_API_FABRIC_SERVER:?LEITESOL_API_FABRIC_SERVER is required}
      LEITESOL_API_FABRIC_DATABASE: ${LEITESOL_API_FABRIC_DATABASE:-AgenteFaturamentoDW}
      LEITESOL_API_FABRIC_AUTHENTICATION: ${LEITESOL_API_FABRIC_AUTHENTICATION:-ActiveDirectoryServicePrincipal}
      LEITESOL_API_FABRIC_DRIVER: ${LEITESOL_API_FABRIC_DRIVER:-ODBC Driver 18 for SQL Server}
      LEITESOL_API_FABRIC_CONNECTION_TIMEOUT: ${LEITESOL_API_FABRIC_CONNECTION_TIMEOUT:-10}
      LEITESOL_API_ENTRA_TENANT_ID: ${LEITESOL_API_ENTRA_TENANT_ID:?LEITESOL_API_ENTRA_TENANT_ID is required}
      LEITESOL_API_ENTRA_CLIENT_ID: ${LEITESOL_API_ENTRA_CLIENT_ID:?LEITESOL_API_ENTRA_CLIENT_ID is required}
      LEITESOL_API_ENTRA_CLIENT_SECRET: ${LEITESOL_API_ENTRA_CLIENT_SECRET:?LEITESOL_API_ENTRA_CLIENT_SECRET is required}
      LEITESOL_API_KEY_VAULT_URL: ${LEITESOL_API_KEY_VAULT_URL:?LEITESOL_API_KEY_VAULT_URL is required}
      LEITESOL_API_GEMINI_API_KEY_SECRET_NAME: ${LEITESOL_API_GEMINI_API_KEY_SECRET_NAME:-GEMINI-API-KEY}
      LEITESOL_API_STORAGE_ACCOUNT_URL: ${LEITESOL_API_STORAGE_ACCOUNT_URL:?LEITESOL_API_STORAGE_ACCOUNT_URL is required}
      LEITESOL_API_STORAGE_CONTAINER_NAME: ${LEITESOL_API_STORAGE_CONTAINER_NAME:?LEITESOL_API_STORAGE_CONTAINER_NAME is required}
      LEITESOL_API_STORAGE_BLOB_PREFIX: ${LEITESOL_API_STORAGE_BLOB_PREFIX:-}
    ports:
      - "5000:5000"

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
      target: prod
    environment:
      PORT: 3001
      BACKEND_URL: http://api:5000
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - api
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    environment:
      PORT: 3000
      API_PROXY_PASS: http://gateway:3001/api/
      HEALTH_PROXY_PASS: http://gateway:3001/health/
    depends_on:
      - gateway
    ports:
      - "3000:3000"
