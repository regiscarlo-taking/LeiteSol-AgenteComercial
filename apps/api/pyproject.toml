[project]
name = "leitesol-api"
version = "0.1.0"
description = "Backend principal da plataforma LeiteSol."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "pydantic-settings>=2.3.4,<3.0.0",
    "uvicorn[standard]>=0.30.1,<1.0.0",
    "pyodbc>=5.1.0,<6.0.0",
    "azure-identity>=1.17.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.2.2,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leitesol_api"]
