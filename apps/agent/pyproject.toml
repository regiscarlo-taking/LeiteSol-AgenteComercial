[project]
name = "leitesol-agent"
version = "0.1.0"
description = "Base do agente comercial da LeiteSol."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.2,<3.0.0",
    "pydantic-settings>=2.3.4,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leitesol_agent"]
