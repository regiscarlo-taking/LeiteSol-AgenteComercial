[project]
name = "leitesol-agent"
version = "0.1.0"
description = "Agente comercial da LeiteSol: catalogo, operacoes e fluxo da pergunta."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leitesol_agent"]
