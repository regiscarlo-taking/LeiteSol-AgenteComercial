services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      PORT: 5000
      LEITESOL_API_ENVIRONMENT: development
      LEITESOL_API_ALLOWED_HOSTS: api,localhost,127.0.0.1
      LEITESOL_API_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      LEITESOL_API_FABRIC_POWERBI_URL: ${LEITESOL_API_FABRIC_POWERBI_URL:-}
      LEITESOL_API_FABRIC_WORKSPACE_ID: ${LEITESOL_API_FABRIC_WORKSPACE_ID:-}
      LEITESOL_API_FABRIC_WAREHOUSE_ID: ${LEITESOL_API_FABRIC_WAREHOUSE_ID:-}
      LEITESOL_API_FABRIC_SERVER: ${LEITESOL_API_FABRIC_SERVER:-}
      LEITESOL_API_FABRIC_DATABASE: ${LEITESOL_API_FABRIC_DATABASE:-AgenteFaturamentoDW}
      LEITESOL_API_FABRIC_AUTHENTICATION: ${LEITESOL_API_FABRIC_AUTHENTICATION:-ActiveDirectoryServicePrincipal}
      LEITESOL_API_FABRIC_DRIVER: ${LEITESOL_API_FABRIC_DRIVER:-ODBC Driver 18 for SQL Server}
      LEITESOL_API_FABRIC_CONNECTION_TIMEOUT: ${LEITESOL_API_FABRIC_CONNECTION_TIMEOUT:-10}
      LEITESOL_API_ENTRA_TENANT_ID: ${LEITESOL_API_ENTRA_TENANT_ID:-}
      LEITESOL_API_ENTRA_CLIENT_ID: ${LEITESOL_API_ENTRA_CLIENT_ID:-}
      LEITESOL_API_ENTRA_CLIENT_SECRET: ${LEITESOL_API_ENTRA_CLIENT_SECRET:-}
      LEITESOL_API_KEY_VAULT_URL: ${LEITESOL_API_KEY_VAULT_URL:-}
      LEITESOL_API_GEMINI_API_KEY_SECRET_NAME: ${LEITESOL_API_GEMINI_API_KEY_SECRET_NAME:-GEMINI-API-KEY}
      LEITESOL_API_STORAGE_ACCOUNT_URL: ${LEITESOL_API_STORAGE_ACCOUNT_URL:-}
      LEITESOL_API_STORAGE_CONTAINER_NAME: ${LEITESOL_API_STORAGE_CONTAINER_NAME:-}
      LEITESOL_API_STORAGE_BLOB_PREFIX: ${LEITESOL_API_STORAGE_BLOB_PREFIX:-}
    volumes:
      - ./apps/api:/app/apps/api
    ports:
      - "5000:5000"

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
      target: dev
    environment:
      PORT: 3001
      BACKEND_URL: http://api:5000
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./apps/gateway:/app/apps/gateway
      - ./packages:/app/packages
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      PORT: 3000
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
    ports:
      - "3000:3000"
